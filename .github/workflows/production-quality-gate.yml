name: Production Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: PostgreSQL migrations and permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      STAGING_BOOTSTRAP_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:55435/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create local Supabase roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c \
            'create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls; create role supabase_admin nologin;'
      - run: npm run test:db:staging-bootstrap

  quality:
    name: Test, security, build and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Text encoding
        run: npm run check:text

      - name: LINE payloads (offline)
        run: npm run validate:line:offline

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Public accessibility
        run: npm run test:a11y

      - name: Authenticated E2E and accessibility
        shell: bash
        run: |
          set +e
          npm run test:e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 40 e2e.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error file=scripts/check-e2e.mjs::$message"
            exit "$status"
          fi
